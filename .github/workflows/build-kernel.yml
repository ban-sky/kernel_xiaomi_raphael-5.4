name: build-raphael-5.4

on:
  push:
  workflow_dispatch:

env:
  KNAME: Zundamon
  KVERNUM: "1.0"
  KSTAGE: "rc1"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev device-tree-compiler \
            clang lld llvm gcc-aarch64-linux-gnu make zip unzip curl

      - name: Show toolchain versions
        run: |
          clang --version | head -1
          ld.lld --version | head -1
          aarch64-linux-gnu-gcc --version | head -1

      - name: Configure (raphael_defconfig)
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            raphael_defconfig

      - name: Build Image and dtbs
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image dtbs

      - name: Build dtbo.img
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            arch/arm64/boot/dts/qcom/dtbo.img || true
          ls -l out/arch/arm64/boot/dts/qcom/dtbo.img || echo "no dtbo.img"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/qcom/*.dtb artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/qcom/*.dtbo artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/qcom/dtbo.img artifacts/ 2>/dev/null || true
          cp out/.config artifacts/config-raphael 2>/dev/null || true
          cp out/include/config/kernel.release artifacts/ 2>/dev/null || true
          ls -lh artifacts

      - name: Package AnyKernel3 flashable zip
        run: |
          KREL=$(cat out/include/config/kernel.release)
          KVER=${KREL%%-*}
          ZIPNAME="${KNAME}-${KVER}-${KVERNUM}${KSTAGE:+-$KSTAGE}.zip"
          echo "KREL=$KREL ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"

          curl -fsSL -o ak3.zip https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip
          unzip -q ak3.zip
          mv AnyKernel3-master ak3

          cat > ak3/anykernel.sh <<EOF
          properties() { '
          kernel.string=${KNAME}-${KVER}-${KVERNUM}${KSTAGE:+-$KSTAGE} for Redmi K20 Pro (raphael), uname: ${KREL}
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=raphael
          device.name2=cepheus
          supported.versions=
          supported.patchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          cp out/arch/arm64/boot/Image ak3/Image
          if [ -f out/arch/arm64/boot/dts/qcom/dtbo.img ]; then
            cp out/arch/arm64/boot/dts/qcom/dtbo.img ak3/dtbo.img
          fi
          (cd ak3 && zip -r9 "../${ZIPNAME}" . -x '*.git*')
          sha256sum "${ZIPNAME}" > "${ZIPNAME}.sha256"
          ls -lh "${ZIPNAME}" "${ZIPNAME}.sha256"

      - name: Verify flashable zip contents
        run: |
          set -e
          ZIP=$(ls Zundamon-*.zip | head -1)
          echo "== $ZIP =="
          unzip -l "$ZIP"
          unzip -l "$ZIP" | grep -qE ' Image$' || { echo "ERROR: Image missing in zip"; exit 1; }
          unzip -l "$ZIP" | grep -q ' anykernel.sh$' || { echo "ERROR: anykernel.sh missing"; exit 1; }
          unzip -l "$ZIP" | grep -q ' tools/ak3-core.sh$' || { echo "ERROR: tools/ak3-core.sh missing"; exit 1; }
          if unzip -l "$ZIP" | grep -q ' dtbo.img$'; then
            echo "OK: dtbo.img present, ak3 will flash dtbo partition"
          else
            echo "WARNING: dtbo.img absent, only boot will be flashed"
          fi

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: Zundamon-5.4.302-${{ env.KVERNUM }}-${{ env.KSTAGE }}
          path: |
            Zundamon-*.zip
            Zundamon-*.zip.sha256
          if-no-files-found: error

      - name: Upload raw images
        uses: actions/upload-artifact@v4
        with:
          name: raphael-5.4-image
          path: artifacts/
          if-no-files-found: warn
